title:"THE EGG AND THE SNAKE",paragraphs:[`At most one EGG can land on a base game board. When it lands, a snake hatches on the EGG's cell. It starts with length 1 and unfurls to length ${e.hatchLength} over its first two moves.`,`The MOVES counter shows how many moves the snake makes this spin (${e.movesBase[0]} to ${e.movesBase[1]} in the base game, ${e.movesFree[0]} to ${e.movesFree[1]} in free spins). Each move takes the head one cell up, down, left or right. The snake never leaves the grid and never crosses its own body.`,"When the snake's tail leaves a cell, a fresh gem drops into it at once, so the board never has holes. Fresh gems are always one of the eight paying symbols (never a KEY, PEARL or EGG) and count for this spin's wins. The snake eats whatever its head moves onto, fresh gems included. Eaten symbols and KEYs are covered by the body. KEYs are counted when they land, before the snake moves.","The snake's whole body is WILD. Wild cells substitute for every paying symbol and can be part of clusters of several different symbols in the same spin. A cluster must contain at least one real symbol; a group made only of wild cells does not pay. KEYs and uneaten PEARLs block clusters.","At the end of a base game spin the snake stays where it finished, so you can see it, until your next spin starts; then it fades away as the new board drops. It takes no part in the next spin: nothing carries over."]},{id:"pearls",title:"PEARLS AND THE MULTIPLIER",paragraphs:["PEARLs only land together with an EGG in the base game, and on any free spin. Each PEARL shows its value: White +1, Gold +2, Rose +3, Black +5, Venom +10 (free spins only) and Venom +25 (VENOM HUNT only).","When the snake eats a PEARL, the pearl's value is added to the multiplier and the snake grows by one segment. The multiplier starts at ×1. The whole spin win (the sum of all cluster wins) is multiplied by it.",`The snake can grow to a length of ${e.lengthCap}. After that, eaten PEARLs still add to the multiplier but the snake no longer grows. PEARLs the snake does not eat have no effect and do not pay.`,`Base game values: ${rc(t.base)}. THE HUNT: ${rc(t.hunt)}. VENOM HUNT: ${rc(t.venom)}.`]},{id:"ouroboros",title:"OUROBOROS",paragraphs:[`When the snake is at least ${e.minBiteLength} long and is not still growing, its head can bite its own tail. If the closed ring encloses at least one cell, OUROBOROS happens.`,"Every enclosed cell is constricted into the highest-paying symbol found inside the ring (H1 if there is none). Enclosed KEYs and PEARLs are changed too. Crushed PEARLs add nothing.","The multiplier is doubled. The ring is the snake's body, so it stays WILD for the win evaluation.","The bite is always the snake's last move of the spin. Any moves left on the counter are forfeited. OUROBOROS can happen at most once per spin, and several times in one bonus round. It needs a long snake, so it is seen mostly during free spins."]},{id:"hunt",title:"THE HUNT (FREE SPINS)",paragraphs:[`3, 4 or 5 KEYs anywhere on a base game board award ${s.awards[3]}, ${s.awards[4]} or ${s.awards[5]} free spins of THE HUNT. The base spin is completed first.`,`A snake of length ${s.huntLength} with a ×${s.huntMult} multiplier enters the board from an edge. It stays on the board for the whole feature: its position, length and multiplier carry over from spin to spin. The multiplier never resets during the feature.`,"Each free spin, new symbols land in every cell the snake does not occupy, then the snake makes its moves.",`3 or more KEYs on a free spin award +${s.retrigger} free spins, up to ${s.max} free spins in total.`,`In the base game THE HUNT triggers on average once every ${df(r.huntTrigger)} spins, and once every ${df(n.huntTrigger)} spins with SERPENT CALL on.`]},{id:"venom",title:"VENOM HUNT",paragraphs:[`VENOM HUNT can only be bought. It plays like THE HUNT with ${s.venomSpins} free spins, but the snake enters at length ${s.venomLength} with a ×${s.venomMult} multiplier, and Venom PEARLs +10 and +25 can land. Retriggers work as in THE HUNT (+${s.retrigger}, up to ${s.max} in total).`]},{id:"maxwin",title:"MAXIMUM WIN",paragraphs:[`The maximum win is ${i}× the base bet in every mode, including bought features. When a round's total win reaches ${i}×, the win is capped at ${i}×, the round ends immediately and any remaining free spins or moves are forfeited.`]},{id:"rtp",title:"RETURN TO PLAYER",paragraphs:[`Theoretical return to player: BASE GAME ${io(si("base"))}, SERPENT CALL ${io(si("ante"))}, THE HUNT ${io(si("hunt"))}, VENOM HUNT ${io(si("venom"))}.`,"The expected return is calculated over many plays. It is a long-term statistical average and says nothing about the result of any single round."]}].map(o=>({...o,title:fs(o.title),paragraphs:o.paragraphs.map(fs)}))}function B0(){return[{label:"SPIN",text:"Starts a round at the current bet. Press the spacebar to spin. During a round, the spacebar or a tap on the board skips animations."},{label:"− / +",text:"Lowers or raises the bet. Tap the bet amount to choose any bet level."},{label:"SERPENT CALL",text:`Turns the ante on or off. While it is on, each spin costs ${I0("ante")}× the bet and THE HUNT triggers more often.`},{label:"BUY",text:"Opens the feature menu to buy THE HUNT or VENOM HUNT. A purchase must be confirmed."},{label:"AUTO",text:"Opens the autoplay settings. Autoplay starts only after you confirm, and stops when you press STOP or a stop condition is met."},{label:"TURBO",text:"Plays animations faster. It never changes the outcome."},{label:"SOUND",text:"Mutes or unmutes the game."},{label:"i",text:"Opens these game rules."},{label:"MENU",text:"Opens the settings: sound and music volume, turbo and reduced motion."}].map(s=>({label:fs(s.label),text:fs(s.text)}))}function I0(s){var e;return String(((e=Tt.modes.find(t=>t.id===s))==null?void 0:e.cost)??1)}const U0="Malfunction voids all wins and plays. A consistent internet connection is required. In the event of a disconnection
