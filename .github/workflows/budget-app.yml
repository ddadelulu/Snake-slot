name: budget-app

on:
  push:
    paths:
      - 'budget-app/**'
      - '.github/workflows/budget-app.yml'
  pull_request:
    paths:
      - 'budget-app/**'
      - '.github/workflows/budget-app.yml'

concurrency:
  group: budget-app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: budget-app

jobs:
  checks:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: budget-app/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Native bundle builds (route tests must stay out of src/app)
        run: npx expo export --platform android --output-dir /tmp/android-bundle
        working-directory: budget-app/apps/mobile

  database:
    name: Database (migrations, RLS, generated types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: budget-app/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: npm ci
      - name: Start Postgres and apply migrations
        run: supabase db start
      - name: Schema, RLS and integrity tests
        run: npm run test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Generated types match the schema
        run: |
          supabase gen types typescript --local --schema public \
            | npx prettier --stdin-filepath packages/core/src/database.types.ts > /tmp/database.types.ts
          diff -u packages/core/src/database.types.ts /tmp/database.types.ts \
            || (echo "Run 'npm run gen:types --workspace @budget/db' and commit the result." && exit 1)

  e2e:
    name: End-to-end (web build against local Supabase)
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: budget-app/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: npm ci
      - name: Start Supabase (database, auth, API)
        run: supabase start -x studio,imgproxy,logflare,vector,realtime,storage-api,postgres-meta,supavisor,edge-runtime
      - name: Build the web app against it
        run: |
          eval "$(supabase status -o env)"
          # The end-to-end tests also call the API directly (to book transactions), so keep both.
          echo "EXPO_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
          EXPO_PUBLIC_SUPABASE_URL="$API_URL" EXPO_PUBLIC_SUPABASE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}" \
            npm run build:web --workspace @budget/mobile
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: budget-app/apps/mobile
      - name: Run Playwright
        run: npm run test:e2e
        working-directory: budget-app/apps/mobile
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            budget-app/apps/mobile/playwright-report
            budget-app/apps/mobile/test-results
          retention-days: 7
